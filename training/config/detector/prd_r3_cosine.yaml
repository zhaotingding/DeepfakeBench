log_dir: ./logs/prd_r3_cosine
model_name: lora
backbone_name: vit
pretrained_root: null
clip_path: clip-vit-large-patch14
vae_path: vae_original
data_root: /home/zhaoting.ding/local_datasets

train_dataset: [FaceForensics++]
test_dataset: [Celeb-DF-v2, DFDCP, DFDC]
train_batchSize: 32
test_batchSize: 16
workers: 8
frame_num: {'train': 8, 'test': 32}
resolution: 224
compression: c23
with_mask: false
with_landmark: false
use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100
mean: [0.48145466, 0.4578275, 0.40821073]
std: [0.26862954, 0.26130258, 0.27577711]

nEpochs: 30
start_epoch: 0
save_epoch: 1
rec_iter: 100
manualSeed: 1024
save_ckpt: true
save_feat: true
lr_scheduler: null
metric_scoring: auc
cuda: true
cudnn: true
optimizer:
  type: adam
  adam:
    lr: 0.0002
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false

probe:
  type: sd15_vae
  sigma: 1.0
  vae_path: null
residual:
  type: cosine
encoder:
  type: clip
feature_mode: concat
analysis:
  save_features: false
  compute_statistics: true
  statistics_max_samples: 2048
experiment:
  name: prd_r3_cosine
  seed: 1024
